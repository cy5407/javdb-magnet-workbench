name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

# 沒有這個區塊時，GITHUB_TOKEN 會吃 repo／org 的預設權限（可能是 write-all）。
# 這個 workflow 只讀原始碼並把結果送到 SonarCloud，不寫回 GitHub，所以只給讀。
# PR 掃描時 scan-action 需要讀 PR metadata 做 new-code 判定，故加 pull-requests: read。
permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
        with:
          # Full history so SonarCloud can do proper blame / new-code detection
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          # Node 20 is EOL and got no fix for CVE-2026-111497 (Brotli decoder
          # OOB write, reachable via fetch()/zlib). 24.x line fixed in 24.22.1;
          # app/package.json engines already allows >=24.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        # Inline pins instead of `-r <file>`: Sonar's GHA rule cannot
        # introspect requirements files and treats `-r` as unbounded.
        # Versions must mirror requirements-sidecar.txt / requirements-ci.txt.
        # --only-binary :all: refuses sdists, so no package's setup script runs
        # on the runner (Sonar GHA rule); every pin here ships a cp312 wheel.
        run: |
          python -m pip install --only-binary :all: --upgrade 'pip==25.0.1'
          python -m pip install --only-binary :all: \
            'pyinstaller==6.19.0' \
            'curl_cffi==0.15.0' \
            'requests==2.34.2' \
            'beautifulsoup4==4.14.3' \
            'urllib3==2.7.0' \
            'charset-normalizer==3.4.4' \
            'idna==3.15' \
            'certifi==2026.1.4' \
            'pytest==9.0.3' \
            'coverage==7.6.10'

      - name: Run frontend coverage
        working-directory: app
        run: npm run test:coverage

      - name: Run Python coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage xml -o coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
