[package]
name = "rust_fetch_javdb"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rust_fetch_javdb"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
