[package]
name = "rquest_fetch_javdb"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rquest_fetch_javdb"
path = "src/main.rs"

[dependencies]
rquest = { version = "5.1", default-features = false, features = ["webpki-roots", "gzip", "brotli", "deflate"] }
rquest-util = { version = "2.2", default-features = true }
tokio = { version = "1", features = ["macros", "rt"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
