# SonarCloud configuration for cy5407/javdb-magnet-workbench
# Monorepo: Python sidecar/scripts at root + Tauri app (TS/Svelte + Rust) under app/

sonar.organization=cy5407
sonar.projectKey=cy5407_javdb-magnet-workbench
sonar.projectName=javdb-magnet-workbench

# Scan the whole repo; exclude generated, vendored, and legacy paths below.
sonar.sources=.
sonar.tests=tests,app/src/lib

sonar.sourceEncoding=UTF-8

# Exclusions (build output, dependencies, generated, legacy/spike code)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  app/src-tauri/target/**,\
  app/src-tauri/gen/**,\
  legacy/**,\
  spikes/**,\
  docs/**,\
  **/*.d.ts,\
  **/*.min.js,\
  **/*.lock

# Test file patterns
sonar.test.inclusions=tests/**,app/src/lib/**/*.test.ts
sonar.coverage.exclusions=\
  tests/**,\
  app/src/lib/**/*.test.ts,\
  **/*.config.*,\
  app/src-tauri/build.rs,\
  scripts/**

# Coverage report paths (populated only if you wire coverage tooling later)
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.community.rust.lcov.reportPaths=app/src-tauri/lcov.info

# Issue exclusions
# text:S8565 (Python dependency lock file should be committed) on pyproject.toml:
# this repo's pyproject.toml is only a [tool.bandit] config carrier — runtime
# dependencies live in requirements-ci.txt / requirements-sidecar.txt, so there
# is no [project] section to lock. The rule's premise (pyproject.toml = Python
# manifest) does not hold here.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.e1.resourceKey=**/pyproject.toml
