# SonarCloud configuration for javdb-magnet-workbench
# Replace `sonar.organization` with your actual SonarCloud organization key.

sonar.organization=cy5407
sonar.projectKey=cy5407_javdb-magnet-workbench
sonar.projectName=javdb-magnet-workbench

# Source layout: TypeScript/Svelte frontend + Rust backend (Tauri)
sonar.sources=src,src-tauri/src
sonar.tests=src/lib
sonar.test.inclusions=**/*.test.ts

# Encoding
sonar.sourceEncoding=UTF-8

# Skip generated / vendored / build output
sonar.exclusions=node_modules/**,dist/**,src-tauri/target/**,src-tauri/gen/**,**/*.d.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.config.*,src-tauri/build.rs

# Coverage report paths (created only if you enable coverage in vitest / cargo)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.community.rust.lcov.reportPaths=src-tauri/lcov.info
