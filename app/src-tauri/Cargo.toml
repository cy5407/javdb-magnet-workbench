[package]
name = "javdbmagnet"
version = "0.3.0"
description = "JavDBMagnet — Tauri UI for JavDB scraping & Real-Debrid integration"
authors = ["JavDBMagnet"]
edition = "2021"

[lib]
name = "javdbmagnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio mpsc is used by SidecarManager to bridge plugin-shell stdout events
# to per-request response reads. tauri's async runtime is built on tokio so
# this aligns with what's already in the binary; we just need the explicit
# dep to import mpsc::unbounded_channel without going through tauri internals.
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# RD API token storage, split per platform so each target pulls only its own
# backend. A single all-targets line pulled `secret-service` into every build
# without enabling one of its runtime features — a hard compile error on Linux,
# which is why `cargo test --lib` was recorded as an unusable gate. Windows is
# unaffected in behaviour; it just stops compiling two backends it never uses.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# sync-secret-service (dbus-secret-service) rather than the async one: it needs
# no zbus runtime feature, and every keyring call site here is synchronous.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
