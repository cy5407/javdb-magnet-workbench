[package]
name = "javdbmagnet"
version = "0.1.0"
description = "JavDBMagnet — Tauri UI for JavDB scraping & Real-Debrid integration"
authors = ["JavDBMagnet"]
edition = "2021"

[lib]
name = "javdbmagnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
