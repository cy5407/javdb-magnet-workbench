[package]
name = "javdbmagnet"
version = "0.2.0"
description = "JavDBMagnet — Tauri UI for JavDB scraping & Real-Debrid integration"
authors = ["JavDBMagnet"]
edition = "2021"

[lib]
name = "javdbmagnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio mpsc is used by SidecarManager to bridge plugin-shell stdout events
# to per-request response reads. tauri's async runtime is built on tokio so
# this aligns with what's already in the binary; we just need the explicit
# dep to import mpsc::unbounded_channel without going through tauri internals.
tokio = { version = "1", features = ["sync"] }
# RD API token storage. Backed by Windows Credential Manager on the dev box;
# `apple-native` / `linux-native-async-persistent` enable the equivalent
# secure stores on the other targets so `keyring::Entry` works uniformly.
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
