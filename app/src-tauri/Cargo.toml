[package]
name = "javdbmagnet"
version = "0.3.0"
description = "JavDBMagnet — Tauri UI for JavDB scraping & Real-Debrid integration"
authors = ["JavDBMagnet"]
edition = "2021"

[lib]
name = "javdbmagnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio mpsc is used by SidecarManager to bridge plugin-shell stdout events
# to per-request response reads. tauri's async runtime is built on tokio so
# this aligns with what's already in the binary; we just need the explicit
# dep to import mpsc::unbounded_channel without going through tauri internals.
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# RD API token storage, split per platform so each target pulls only its own
# backend. A single all-targets line pulled `secret-service` into every build
# without enabling one of its runtime features — a hard compile error on Linux,
# which is why `cargo test --lib` was recorded as an unusable gate. Windows is
# unaffected in behaviour; it just stops compiling two backends it never uses.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# sync-secret-service (dbus-secret-service) rather than the async one: it needs
# no zbus runtime feature, and every keyring call site here is synchronous.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

# tauri's `test` feature (MockRuntime) is `test = []` in tauri's manifest: no
# extra crates. Tests use it to build the real sidecar Command without spawning.
# Not on Windows: building a mock App links comctl32's TaskDialogIndirect, which
# only exists in Common Controls v6. tauri-build embeds the v6 manifest into the
# app binary but not into test executables, so the lib test exe dies at load
# with STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) before any test runs.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

# wayland-scanner 0.31.10 pins vulnerable quick-xml 0.39.x. The vendored
# source only raises that dependency to 0.41 and adapts its GeneralRef decode.
[patch.crates-io]
wayland-scanner = { path = "../../vendor/wayland-scanner-0.31.10" }
